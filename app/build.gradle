apply plugin: 'com.android.application'

// versionCode = CI run number (always increasing, so every build installs over the last).
// versionName = the release tag without "v" on tag builds (v1.1.0 -> 1.1.0); the in-app
// updater compares it with the latest GitHub release. Other builds are "<next>-dev.<run>".
def ciRun = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def baseVersion = "1.6.0"
def refName = System.getenv("GITHUB_REF_NAME") ?: ""
def isTagBuild = System.getenv("GITHUB_REF_TYPE") == "tag" && refName ==~ /v\d+(\.\d+)*.*/
def verName = isTagBuild ? refName.substring(1) : (baseVersion + "-dev." + ciRun)

android {
    // Java package kept from upstream; applicationId differs so it installs
    // next to the official YouTube app and next to upstream YTPro.
    namespace "com.google.android.youtube.pro"
    compileSdk 36

    defaultConfig {
        applicationId "com.yywgov.ytlite"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode ciRun
        versionName verName
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // JVM unit tests (417): plain-Java logic only; Android stubs return defaults instead of throwing
    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.13.1' // FileProvider for the updater
    testImplementation 'junit:junit:4.13.2'
}
