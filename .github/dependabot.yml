# Monthly update PRs (431): AndroidX / Gradle plugin, the JS test tools, GitHub Actions.
# Nothing merges by itself; every PR goes through the same CI (tests + build).
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: "/tests/js"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
