name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# a newer push to the same branch cancels the older build (426); release tags always run to the end
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the rules check compares with the previous commit

      - name: Remote rules – schema, selectors, sha256, version (423)
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess, sys
          raw = open('rules/rules.json', 'rb').read()
          sha = hashlib.sha256(raw).hexdigest()
          want = open('rules/rules.json.sha256').read().strip()
          if sha != want: sys.exit('rules.json.sha256 is stale: expected %s, file says %s' % (sha, want))
          r = json.loads(raw)
          if r.get('schema') != 1: sys.exit('rules.json: schema must be 1')
          v = r.get('version')
          if not isinstance(v, int) or v < 1: sys.exit('rules.json: version must be a positive integer')
          hide = r.get('hide', [])
          if not isinstance(hide, list) or len(hide) > 200: sys.exit('rules.json: hide must be a list of at most 200')
          for s in hide:
              if not isinstance(s, str) or not s.strip() or len(s) >= 200: sys.exit('rules.json: bad selector %r' % (s,))
          ad_text = r.get('adText', [])
          if not isinstance(ad_text, list) or len(ad_text) > 20 or any(not isinstance(t, str) or not t.strip() or len(t) > 20 for t in ad_text):
              sys.exit('rules.json: adText must be at most 20 short strings')
          try:
              changed = subprocess.run(['git', 'diff', '--quiet', 'HEAD~1', '--', 'rules/rules.json']).returncode == 1
              if changed:
                  old = json.loads(subprocess.check_output(['git', 'show', 'HEAD~1:rules/rules.json']))
                  if v <= old.get('version', 0): sys.exit('rules.json changed but version was not increased (%s -> %s)' % (old.get('version'), v))
          except subprocess.CalledProcessError:
              print('no previous rules.json to compare')
          print('rules ok: version %d, %d selectors, sha256 %s' % (v, len(hide), sha))
          PY

      - name: Set up Node (JS unit tests)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm                                   # (426)
          cache-dependency-path: tests/js/package-lock.json

      - name: JS unit tests (jsdom) – a failure stops the build
        working-directory: tests/js
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Java unit tests (JUnit, 417) + build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease

      - name: Release APK still has every JS bridge method (429)
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess, sys, zipfile
          src = open('app/src/main/java/com/google/android/youtube/pro/webview/WebAppInterface.java', encoding='utf-8').read()
          want = sorted(set(re.findall(r'@JavascriptInterface\s+public\s+[\w<>]+\s+(\w+)\(', src)))
          tools = sorted(glob.glob(os.path.join(os.environ.get('ANDROID_HOME', '/usr/local/lib/android/sdk'), 'build-tools', '*', 'dexdump')))
          if not tools:
              print('::warning::dexdump not found, bridge check skipped'); sys.exit(0)
          apk = 'app/build/outputs/apk/release/app-release-unsigned.apk'
          os.makedirs('dexcheck', exist_ok=True)
          with zipfile.ZipFile(apk) as z:
              dexes = [z.extract(n, 'dexcheck') for n in z.namelist() if re.match(r'classes\d*\.dex$', n)]
          classes = {}
          for d in dexes:
              out = subprocess.run([tools[-1], d], capture_output=True, text=True).stdout
              for block in out.split('Class #')[1:]:
                  m = re.search(r"Class descriptor\s*:\s*'([^']+)'", block)
                  if m: classes[m.group(1)] = set(re.findall(r"name\s*:\s*'([^']+)'", block))
          # the bridge class is the one holding getConfig + getRemoteRules (its own name may be obfuscated)
          hits = [c for c, names in classes.items() if 'getConfig' in names and 'getRemoteRules' in names]
          if not hits: sys.exit('bridge class not found in the release dex: proguard rules dropped @JavascriptInterface methods')
          missing = [m for m in want if m not in classes[hits[0]]]
          if missing: sys.exit('release APK lost bridge methods: %s' % missing)
          print('bridge ok: %d methods in %s' % (len(want), hits[0]))
          PY

      - name: Keep the R8 mapping (422) – decodes crash stacks from the diagnostics log
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Sign APK
        run: |
          # must match versionName in app/build.gradle
          BASE=$(sed -n 's/^def baseVersion = "\(.*\)"/\1/p' app/build.gradle)
          VERSION="${BASE}-dev.${GITHUB_RUN_NUMBER}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          mkdir -p out
          java -jar signer/apksigner.jar sign \
            --key signer/apkeasytool.pk8 \
            --cert signer/apkeasytool.pem \
            --v4-signing-enabled false \
            --out "out/YiWei-${VERSION}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          java -jar signer/apksigner.jar verify "out/YiWei-${VERSION}.apk"
          # checksum asset: the in-app updater verifies the download against it (83)
          (cd out && sha256sum "YiWei-${VERSION}.apk" | cut -d' ' -f1 > "YiWei-${VERSION}.apk.sha256")
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YiWei-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Release notes from the annotated tag (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/-----BEGIN PGP/,$d' > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/*.apk.sha256
          body_path: release-notes.md
          # Chinese notes only (397): the generated English "What's Changed" list would end up in the app
          generate_release_notes: false
