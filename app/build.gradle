apply plugin: 'com.android.application'

def ciRun = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    // Java package kept from upstream; applicationId differs so it installs
    // next to the official YouTube app and next to upstream YTPro.
    namespace "com.google.android.youtube.pro"
    compileSdk 36

    defaultConfig {
        applicationId "com.yywgov.ytlite"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode ciRun
        versionName "1.0." + ciRun
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
