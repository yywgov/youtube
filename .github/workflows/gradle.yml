name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# a newer push to the same branch cancels the older build (426); release tags always run to the end
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the rules check compares with the previous commit

      - name: Remote rules – schema, selectors, sha256, version (423)
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess, sys
          raw = open('rules/rules.json', 'rb').read()
          sha = hashlib.sha256(raw).hexdigest()
          want = open('rules/rules.json.sha256').read().strip()
          if sha != want: sys.exit('rules.json.sha256 is stale: expected %s, file says %s' % (sha, want))
          r = json.loads(raw)
          if r.get('schema') != 1: sys.exit('rules.json: schema must be 1')
          v = r.get('version')
          if not isinstance(v, int) or v < 1: sys.exit('rules.json: version must be a positive integer')
          hide = r.get('hide', [])
          if not isinstance(hide, list) or len(hide) > 200: sys.exit('rules.json: hide must be a list of at most 200')
          for s in hide:
              if not isinstance(s, str) or not s.strip() or len(s) >= 200: sys.exit('rules.json: bad selector %r' % (s,))
          ad_text = r.get('adText', [])
          if not isinstance(ad_text, list) or len(ad_text) > 20 or any(not isinstance(t, str) or not t.strip() or len(t) > 20 for t in ad_text):
              sys.exit('rules.json: adText must be at most 20 short strings')
          # optional network block paths (278): the same check as Logic.validBlockPath
          import re
          protected = ['/youtubei/v1/player', '/youtubei/v1/next', '/youtubei/v1/browse', '/youtubei/v1/search', '/youtubei/v1/guide',
                       '/youtubei/v1/reel', '/youtubei/v1/account', '/youtubei/v1/get_watch', '/youtubei/v1/updated_metadata',
                       '/youtubei/v1/live_chat', '/youtubei/v1/notification', '/youtubei/v1/att', '/youtubei/v1/feedback',
                       '/youtubei/v1/like', '/youtubei/v1/subscription', '/youtubei/v1/playlist', '/youtubei/v1/get_transcript',
                       '/youtubei/v1/music', '/watch', '/results', '/feed', '/playlist', '/shorts', '/live', '/s/', '/sw.js',
                       '/manifest', '/api/stats/watchtime', '/api/stats/playback', '/api/timedtext', '/signin', '/logout', '/embed',
                       '/iframe_api', '/channel', '/c/', '/user/', '/@', '/videoplayback', '/generate_204']
          bp = r.get('blockPaths', [])
          if not isinstance(bp, list) or len(bp) > 30: sys.exit('rules.json: blockPaths must be a list of at most 30')
          for p in bp:
              ok = isinstance(p, str) and 6 <= len(p) <= 80 and re.fullmatch(r'/[A-Za-z0-9_./-]+', p) and '//' not in p and '..' not in p \
                  and not any(k.startswith(p) or p.startswith(k) for k in protected)
              if not ok: sys.exit('rules.json: block path not allowed: %r' % (p,))
          # optional search chips (328) and appended words (382)
          chips = r.get('chips', [])
          if not isinstance(chips, list) or len(chips) > 10 or any(not isinstance(c, list) or len(c) != 2 or not isinstance(c[0], str)
                  or not 0 < len(c[0].strip()) <= 12 or not isinstance(c[1], str) or not re.fullmatch(r'[A-Za-z0-9%_-]{0,60}', c[1]) for c in chips):
              sys.exit('rules.json: chips must be at most 10 [label, sp] pairs')
          text = r.get('text', {})
          if not isinstance(text, dict) or any(not isinstance(v, list) or len(v) > 20 or any(not isinstance(t, str) or not t.strip() or len(t) > 30 for t in v)
                  for v in text.values()):
              sys.exit('rules.json: text must map names to at most 20 short words')
          try:
              changed = subprocess.run(['git', 'diff', '--quiet', 'HEAD~1', '--', 'rules/rules.json']).returncode == 1
              if changed:
                  old = json.loads(subprocess.check_output(['git', 'show', 'HEAD~1:rules/rules.json']))
                  if v <= old.get('version', 0): sys.exit('rules.json changed but version was not increased (%s -> %s)' % (old.get('version'), v))
          except subprocess.CalledProcessError:
              print('no previous rules.json to compare')
          print('rules ok: version %d, %d selectors, sha256 %s' % (v, len(hide), sha))
          PY

      - name: Set up Node (JS unit tests)
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm                                   # (426)
          cache-dependency-path: tests/js/package-lock.json

      - name: Page script is src/js joined (435)
        run: node tools/build-js.js --check

      - name: Copy check (430) – warnings only
        run: node tools/lint-copy.js || true

      - name: JS unit tests (jsdom) – a failure stops the build, then the coverage summary (434)
        working-directory: tests/js
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run coverage --silent || echo "::warning::coverage summary failed (tests themselves passed)"

      - name: Minify the page script (259/421) – chrome90 syntax check, test the minified copy, ship it
        run: |
          node tools/minify-js.js build/js
          (cd tests/js && YTL_SRC="$GITHUB_WORKSPACE/build/js/ytlite.min.js" npm test)
          cp build/js/ytlite.min.js app/src/main/assets/ytlite.js

      - name: Keep the JS source map (259)
        uses: actions/upload-artifact@v4
        with:
          name: jsmap-${{ github.ref_name }}-${{ github.run_number }}
          path: build/js/ytlite.min.js.map

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Java unit tests (JUnit, 417) + build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease

      - name: Release APK still has every JS bridge method (429)
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess, sys, zipfile
          src = open('app/src/main/java/com/google/android/youtube/pro/webview/WebAppInterface.java', encoding='utf-8').read()
          want = sorted(set(re.findall(r'@JavascriptInterface\s+public\s+[\w<>]+\s+(\w+)\(', src)))
          tools = sorted(glob.glob(os.path.join(os.environ.get('ANDROID_HOME', '/usr/local/lib/android/sdk'), 'build-tools', '*', 'dexdump')))
          if not tools:
              print('::warning::dexdump not found, bridge check skipped'); sys.exit(0)
          apk = 'app/build/outputs/apk/release/app-release-unsigned.apk'
          os.makedirs('dexcheck', exist_ok=True)
          with zipfile.ZipFile(apk) as z:
              dexes = [z.extract(n, 'dexcheck') for n in z.namelist() if re.match(r'classes\d*\.dex$', n)]
          classes = {}
          for d in dexes:
              out = subprocess.run([tools[-1], d], capture_output=True, text=True).stdout
              for block in out.split('Class #')[1:]:
                  m = re.search(r"Class descriptor\s*:\s*'([^']+)'", block)
                  if m: classes[m.group(1)] = set(re.findall(r"name\s*:\s*'([^']+)'", block))
          # the bridge class is the one holding getConfig + getRemoteRules (its own name may be obfuscated)
          hits = [c for c, names in classes.items() if 'getConfig' in names and 'getRemoteRules' in names]
          if not hits: sys.exit('bridge class not found in the release dex: proguard rules dropped @JavascriptInterface methods')
          missing = [m for m in want if m not in classes[hits[0]]]
          if missing: sys.exit('release APK lost bridge methods: %s' % missing)
          print('bridge ok: %d methods in %s' % (len(want), hits[0]))
          PY

      - name: Keep the R8 mapping (422) – decodes crash stacks from the diagnostics log
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Sign APK
        run: |
          # versionName as Gradle worked it out (432); a tag build must carry the tag's version
          VERSION=$(cat app/build/version.txt)
          [ -n "$VERSION" ] || { echo "app/build/version.txt is empty"; exit 1; }
          if [[ "${GITHUB_REF}" == refs/tags/v* && "$VERSION" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "versionName $VERSION does not match tag ${GITHUB_REF_NAME}"; exit 1
          fi
          mkdir -p out
          java -jar signer/apksigner.jar sign \
            --key signer/apkeasytool.pk8 \
            --cert signer/apkeasytool.pem \
            --v4-signing-enabled false \
            --out "out/YiWei-${VERSION}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          java -jar signer/apksigner.jar verify "out/YiWei-${VERSION}.apk"
          # checksum asset: the in-app updater verifies the download against it (83)
          (cd out && sha256sum "YiWei-${VERSION}.apk" | cut -d' ' -f1 > "YiWei-${VERSION}.apk.sha256")
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YiWei-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Release notes from the annotated tag (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/-----BEGIN PGP/,$d' > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/*.apk.sha256
          body_path: release-notes.md
          # Chinese notes only (397): the generated English "What's Changed" list would end up in the app
          generate_release_notes: false
