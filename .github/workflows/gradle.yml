name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (JS unit tests)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS unit tests (jsdom) – a failure stops the build
        working-directory: tests/js
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Sign APK
        run: |
          # must match versionName in app/build.gradle
          BASE=$(sed -n 's/^def baseVersion = "\(.*\)"/\1/p' app/build.gradle)
          VERSION="${BASE}-dev.${GITHUB_RUN_NUMBER}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          mkdir -p out
          java -jar signer/apksigner.jar sign \
            --key signer/apkeasytool.pk8 \
            --cert signer/apkeasytool.pem \
            --v4-signing-enabled false \
            --out "out/YTLite-${VERSION}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          java -jar signer/apksigner.jar verify "out/YTLite-${VERSION}.apk"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTLite-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Release notes from the annotated tag (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/-----BEGIN PGP/,$d' > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body_path: release-notes.md
          generate_release_notes: true
